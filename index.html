<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>practice</title>

    </head>
    <body>
        <style>
            body{
                width: 100%;
                margin: 0;
                padding: 0;
                background-color: rgba(108, 110, 110, 0.295);
            }
            .a3{
                width: 2em;
                height: 2em;
                border-radius: 50%;
                justify-content: center;
            }
            nav{
                background-color: rgba(163, 165, 165, 0.817);
                width: 100%;
                display: flex;
                justify-content: center;
                text-align: center;
                justify-content: space-evenly 10px;
                
                
                
                padding: 10px;
                border-bottom: 1px solid #535353;
                box-shadow: 0 1px 10px 0.5px #1a1a1a4b;
            }
            .a1{
                display: flex;
                justify-content: center;
                text-align: center;
                padding: 10px;
                margin: 10px;
                justify-content: space-evenly;
                margin-top: 15px;

            }
            
                
            
            nav a{
                text-decoration: none;
                color: rgb(0, 0, 0);
                padding: 5px;
                margin: 10px;
                border: none;
                border-radius: 10px;
                text-transform: capitalize;
                font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
                letter-spacing: -0.1px;
                
            }
            nav a:hover{
                color: cornsilk;
            }

            .menu{
                text-align: center;
                margin-top: 8px;
                
                
            }
            .btn{
            display: flex;
            justify-content: center;
                border: none;
                gap: 10px;
                
                
            }
            .btn-1{
                border-radius: 5px;
                border: none;
                background-color: rgb(23, 64, 64);
                font-size: medium;
                margin-bottom: 15px;
                margin-top: 10px;
                color: white;
                text-align: center;

            
        
                display: flex;
                justify-content: center;
                cursor: pointer;
                
            }
            .btn-2{
                background-color: black;
                color: white;
                margin: 10px;
                margin-bottom: 15px;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
            .btn-1:hover{
                background-color: rgb(89, 87, 80)
            }
            .btn-2:hover{
                background-color: rgb(89, 87, 80)
            }


        </style>
        <nav>
            <div class="a1">
                <div class="a3"><img src="green lahanga.jpg" alt="green" class="a3"></div>
                <div class="menu">
                    <a href="#" target="_blank">services</a>
                    <a href="#" target="_blank">kurti</a>
                    <a href="#" target="_blank">wedding</a>
                    <a href="#" target="_blank">kids clothes</a>
                    <a href="#" target="_blank">lehenga</a>
                    <a href="#" target="_blank">palazo</a>
                    
                </div>
                
            
            <div class="btn">
                <button class="btn-1">login</button>
                <button class="btn-2">contact us</button>

            </div></div>
        </nav>
    </body>
</html>
